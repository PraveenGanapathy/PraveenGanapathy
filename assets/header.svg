<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Praveen Ganapathy Ravi — Data Engineer and Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <radialGradient id="b1"><stop offset="0" stop-color="#3b82f6" stop-opacity=".55"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
    <radialGradient id="b2"><stop offset="0" stop-color="#a855f7" stop-opacity=".45"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
    <radialGradient id="b3"><stop offset="0" stop-color="#06b6d4" stop-opacity=".40"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
    <linearGradient id="name" x1="0" x2="1">
      <stop offset="0" stop-color="#e0f2fe"/><stop offset=".5" stop-color="#93c5fd"/><stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
    <clipPath id="r"><rect width="1000" height="280" rx="20"/></clipPath>
  </defs>
  <style>
    .blob { animation: drift 14s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    .d2 { animation-duration: 18s; animation-delay: -6s; }
    .d3 { animation-duration: 22s; animation-delay: -11s; }
    @keyframes drift { 0% { transform: translate(0,0) scale(1); } 50% { transform: translate(60px,-25px) scale(1.15); } 100% { transform: translate(-50px,20px) scale(.95); } }
    .up { opacity: 0; animation: up .9s cubic-bezier(.2,.7,.2,1) forwards; }
    .u2 { animation-delay: .25s; } .u3 { animation-delay: .5s; } .u4 { animation-delay: .75s; }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .role { opacity: 0; animation: cycle 12s infinite; }
    .r2 { animation-delay: 4s; } .r3 { animation-delay: 8s; }
    @keyframes cycle { 0% { opacity: 0; transform: translateY(8px); } 4%, 30% { opacity: 1; transform: none; } 34%, 100% { opacity: 0; transform: translateY(-8px); } }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .dot { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } .r2, .r3 { display: none; } }
  </style>
  <g clip-path="url(#r)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#grid)"/>
    <ellipse class="blob" cx="780" cy="70" rx="260" ry="200" fill="url(#b1)"/>
    <ellipse class="blob d2" cx="930" cy="240" rx="230" ry="180" fill="url(#b2)"/>
    <ellipse class="blob d3" cx="140" cy="260" rx="260" ry="160" fill="url(#b3)"/>
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
      <text class="up" x="64" y="84" font-size="15" letter-spacing="3" fill="#7dd3fc" font-weight="600">HI THERE, I'M</text>
      <text class="up u2" x="62" y="140" font-size="52" font-weight="800" fill="url(#name)">Praveen Ganapathy Ravi</text>
      <g class="up u3" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="20" fill="#cbd5e1">
        <text x="64" y="186" fill="#64748b">&gt;</text>
        <text class="role" x="86" y="186">building data pipelines</text>
        <text class="role r2" x="86" y="186">designing web apps</text>
        <text class="role r3" x="86" y="186">azure · databricks · python · react</text>
      </g>
      <g class="up u4" font-size="13" fill="#94a3b8">
        <circle class="dot" cx="70" cy="229" r="4" fill="#22c55e"/>
        <text x="84" y="234">World Bank Group  ·  MS Data Science @ UMass Dartmouth</text>
      </g>
    </g>
  </g>
  <rect x=".5" y=".5" width="999" height="279" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</svg>
