<svg xmlns="http://www.w3.org/2000/svg" width="480" height="176" viewBox="0 0 480 176" role="img" aria-label="Sales Trends Viz">
  <defs>
    <linearGradient id="a" x1="0" x2="1"><stop offset="0" stop-color="#ec4899"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="sheen" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect x="1" y="1" width="478" height="174" rx="14"/></clipPath>
  </defs>
  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .title { fill: #1f2328; } .desc { fill: #59636e; font-size: 14px; }
    .chip { fill: #f6f8fa; stroke: #d0d7de; } .chipt { fill: #59636e; font-size: 12px; }
    .arrow { fill: #8c959f; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .title { fill: #f0f6fc; } .desc { fill: #9198a1; }
      .chip { fill: #161b22; stroke: #30363d; } .chipt { fill: #9198a1; }
      .arrow { fill: #6e7681; }
    }
    .sheen { animation: sweep 6s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-160px); } 60%, 100% { transform: translateX(560px); } }
    @media (prefers-reduced-motion: reduce) { .sheen { display: none; } }
  </style>
  <rect class="bg" x="1" y="1" width="478" height="174" rx="14"/>
  <g clip-path="url(#c)">
    <rect x="0" y="0" width="480" height="4" fill="url(#a)"/>
    <rect class="sheen" x="0" y="0" width="140" height="4" fill="url(#sheen)" opacity=".7"/>
    <circle cx="470" cy="166" r="90" fill="url(#a)" opacity=".07"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
    <rect x="28" y="24" width="20" height="20" rx="6" fill="url(#a)"/>
    <text class="title" x="58" y="40" font-size="19" font-weight="700">Sales Trends Viz</text>
    
    <text class="desc" x="28" y="86">Interactive view of sales trends, product</text><text class="desc" x="28" y="106">performance, and regional distribution.</text>
    <rect class="chip" x="28" y="128" width="56" height="24" rx="12"/><text class="chipt" x="56" y="144" text-anchor="middle">D3.js</text><rect class="chip" x="92.0" y="128" width="92" height="24" rx="12"/><text class="chipt" x="138" y="144" text-anchor="middle">JavaScript</text>
    <text class="arrow" x="440" y="152" font-size="16" text-anchor="middle">↗</text>
  </g>
</svg>
